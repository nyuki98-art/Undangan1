    --tape-shadow:#00000030;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background:var(--maroon);
    color:var(--cream);
    font-family:'Space Mono', monospace;
    min-height:100%;
    overflow-x:hidden;
  }
  body{
    background:
      radial-gradient(ellipse 120% 60% at 50% 0%, var(--maroon-light) 0%, transparent 60%),
      var(--maroon);
    display:flex;
    justify-content:center;
    padding:56px 20px 64px;
  }
  .card{
    width:100%;
    max-width:420px;
    text-align:center;
  }
  .script{
    font-family:'Aurelie Smith', cursive;
    line-height:0.95;
    color:var(--cream);
  }
  .headline{
    font-size:clamp(76px, 21vw, 104px);
    letter-spacing:0.5px;
    opacity:0;
    transform:translateY(14px);
    animation:rise 0.9s ease-out 0.1s forwards;
  }
  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }

  .photo-wrap{
    position:relative;
    width:78%;
    max-width:300px;
    margin:34px auto 0;
    opacity:0;
    animation:rise 0.9s ease-out 0.35s forwards;
  }
  .photo-frame{
    display:block;
    width:100%;
    border-radius:2px;
    box-shadow:0 18px 40px -12px #00000070, 0 2px 0 #ffffff08 inset;
  }
  .tape{
    position:absolute;
    top:-16px;
    right:-22px;
    width:120px;
    height:44px;
    background:linear-gradient(100deg, var(--tape) 0%, #ded7c6 100%);
    box-shadow:0 6px 10px var(--tape-shadow);
    transform:rotate(38deg);
    opacity:0.9;
  }
  .sparkle{
    position:absolute;
    color:var(--cream);
    opacity:0.75;
    font-size:20px;
  }
  .sparkle.s1{ left:-26px; top:30%; font-size:16px; }
  .sparkle.s2{ left:-14px; top:42%; font-size:12px; }
  .sparkle.s3{ right:-24px; bottom:18%; font-size:18px; }

  .eyebrow{
    margin-top:40px;
    font-size:13px;
    letter-spacing:4px;
    color:var(--cream-dim);
    opacity:0;
    animation:rise 0.9s ease-out 0.5s forwards;
  }
  .couple-names{
    font-family:'Aurelie Smith', cursive;
    font-size:clamp(40px, 11vw, 54px);
    margin-top:6px;
    color:var(--cream);
    opacity:0;
    animation:rise 0.9s ease-out 0.6s forwards;
  }

  .dear-block{
    margin-top:34px;
    opacity:0;
    animation:rise 0.9s ease-out 0.75s forwards;
  }
  .dear-label{
    font-size:13px;
    color:var(--cream-dim);
    letter-spacing:2px;
  }
  .guest-name{
    margin-top:10px;
    font-size:clamp(20px, 6vw, 26px);
    font-weight:700;
    letter-spacing:1px;
    word-break:break-word;
    padding:0 12px;
  }

  .cta{
    display:inline-block;
    margin-top:36px;
    background:var(--cream);
    color:var(--maroon-deep);
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.5px;
    text-decoration:none;
    padding:16px 34px;
    border-radius:8px;
    box-shadow:0 10px 24px -8px #00000060;
    opacity:0;
    animation:rise 0.9s ease-out 0.9s forwards;
    transition:transform 0.15s ease;
  }
  .cta:active{ transform:scale(0.97); }

  @media (prefers-reduced-motion: reduce){
    .headline,.photo-wrap,.eyebrow,.couple-names,.dear-block,.cta{
      animation:none !important; opacity:1 !important; transform:none !important;
    }
  }
</style>
</head>
